services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nubank_gastos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/nubank_gastos
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-strong-random-secret}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      APP_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://frontend
    depends_on:
      - db
      - mailhog
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
